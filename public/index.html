<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- TODO: Définir le nom de l'application selon une variable d'environnement. -->
    <title>IGN - Validateur</title>

    <!-- Chemins relatifs (css, img...) résolus depuis la racine quelle que soit la route -->
    <base href="/">

    <link rel="icon" href="img/favicon.ico">

    <!-- style-carto.css embarque Bootstrap 4 -->
    <link rel="stylesheet" href="css/style-carto.css"/>

</head>

<body>

    <div id="main" class="body-wrapper">

    </div>

    <script src="/dist/validator-client.js"></script>
    <script>
        /*
         * API IGNF/validator-api lancée séparément, relayée par server.js (même origine : cookie de session OIDC)
         * (IGNF/validator-api utilise sa propre template twig)
         */
        validator.setValidatorApiUrl("/api");
        // Spec servie via le proxy de server.js (évite CORS et le certificat auto-signé)
        validator.setValidatorSpecsUrl("/api/validator-api.yml");
        validator.createDemoApplication({
            targetElement: document.getElementById('main'),
            // URLs sans "#" : server.js renvoie index.html pour toutes les routes
            basename: '/'
        });
    </script>
</body>

</html>
