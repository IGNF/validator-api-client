name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build

      - name: Check that dist/ is up to date with src/
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ is out of sync with src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi
